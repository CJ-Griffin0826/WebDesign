        <main>

          <section class="parallax-banner-scroll" style="background-image: url('images/Penguin\ 1.jpg')";>
            <div class="parallax-banner-overlay">
              <div class="parallax-banner-content">
                <h1>Penguin</h1>
              </div>
            </div>
          </section>

          <meta charset="UTF-8">
          <title>Citrus Carousel</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
          <link rel="stylesheet" href="style/style.css">
        
        </main>

    </head>
    
    <body>

      <script>
        let latestScroll = 0;
        window.addEventListener('scroll', () => {
          latestScroll = window.scrollY;
        });
        function parallaxLoop(){
          const banners = document.querySelectorAll('.parallax-banner-scroll');

          banners.forEach(banner => {
            let offset = latestScroll * 0.3;
            banner.style.backgroundPositionY = '${offset}px';
          });
          requestAnimationFrame(parallaxLoop);
        }
        parallaxLoop();
      </script>
    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    </body>
